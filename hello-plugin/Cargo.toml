[package]
name = "hello-plugin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = ["http"]
http = []

[dependencies]
oxide-plugin-sdk = { path = "../oxide-plugin-sdk", features = ["http"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[target.wasm32-unknown-unknown.dependencies]
# Ensure we use minimal std features for WASM
getrandom = { version = "0.4.2", features = ["wasm_js"] }
