# OxideDB Plugin Manifest
# This file describes the plugin metadata, capabilities, and security requirements

[plugin]
name = "hello-plugin"
version = "1.0.0"
description = "A simple demonstration plugin for OxideDB that showcases basic CRUD operations and HTTP route handling"
author = "OxideDB Team <team@oxidedb.com>"
homepage = "https://github.com/oxidedb/hello-plugin"
license = "MIT"
min_oxide_version = "0.1.0"
keywords = ["demo", "crud", "http", "tutorial"]
categories = ["examples", "tutorials"]
changelog = "v1.0.0: Initial release with full CRUD and HTTP capabilities"
build_timestamp = "2024-01-01T00:00:00Z"
wasm_file = "hello-plugin.wasm"

[security]
required_capabilities = [
    "LogInfo",
    "LogError", 
    "ReadEventData",
    "ModifyEventData",
    "CreateRecords",
    "ReadRecords",
    "UpdateRecords",
    "RegisterHttpRoutes",
    "HandleHttpRequests"
]
recommended_trust_level = "PartiallyTrusted"
security_contact = "security@oxidedb.com"
security_advisories = []

[security.audit_info]
audit_date = "2024-01-01"
auditor = "OxideDB Security Team"
report_url = "https://oxidedb.com/security/hello-plugin-audit"
status = "passed"

[dependencies]
[dependencies.plugins]
# No plugin dependencies

[dependencies.system]
min_memory_mb = 4
cpu_features = []
system_libs = []

[config]
schema = '''
{
    "type": "object",
    "properties": {
        "enable_logging": {
            "type": "boolean",
            "default": true,
            "description": "Enable detailed logging"
        },
        "max_items": {
            "type": "integer",
            "default": 1000,
            "description": "Maximum number of items to process"
        },
        "allowed_collections": {
            "type": "array",
            "items": { "type": "string" },
            "default": ["items", "processed_data"],
            "description": "Collections this plugin can access"
        }
    }
}
'''

[config.defaults]
enable_logging = true
max_items = 1000
allowed_collections = ["items", "processed_data"]