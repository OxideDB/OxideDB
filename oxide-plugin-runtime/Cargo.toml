[package]
name = "oxide-plugin-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Wasmtime-based plugin runtime for OxideDB"

[dependencies]
oxide-core = { path = "../oxide-core" }
oxide-db = { path = "../oxide-db" }
oxide-plugin-sdk = { path = "../oxide-plugin-sdk" }
oxide-logging = { path = "../oxide-logging" }
wasmtime = "45.0.2"
wasmtime-wasi = "45.0.2"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"
thiserror = "2.0.18"
anyhow = "1.0.102"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread"] }
sha2 = "0.11.0"

[dev-dependencies]
async-trait = "0.1.89"
