[package]
name = "oxide-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
oxide-core = { path = "../oxide-core" }
oxide-db = { path = "../oxide-db" }
oxide-logging = { path = "../oxide-logging" }
oxide-vfs = { path = "../oxide-vfs" }
oxide-plugin-runtime = { path = "../oxide-plugin-runtime" }
oxide-plugin-sdk = { path = "../oxide-plugin-sdk" }
axum = {version = "0.7", features = ["multipart"]}
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
hyper = { version = "1.0", features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ts-rs = { version = "10.1", features = ["serde-compat"] }
include_dir = "0.7"
mime_guess = "2.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
sha2 = "0.10"
zip = "2.1"
toml = "0.8"
