[workspace]
resolver = "2"
members = [
    "oxide-core",
    "oxide-db", 
    "oxide-api",
    "oxide-logging",
    "oxide-vfs",
    "oxide-plugin-runtime",
    "oxide-plugin-sdk",
    "oxide-typegen",
    "oxide-benchmarks",
    "oxidedb",
    "hello-plugin"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["bangprovn"]
license = "MIT"
description = "OxideDB - A hook-first database with plugin architecture"
repository = "https://github.com/bangprovn/oxidebase"
readme = "README.md"
keywords = ["database", "plugin", "wasm", "hooks", "admin-ui"]
categories = ["database", "web-programming"]

[workspace.dependencies]
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
argon2 = { version = "0.5.3", features = ["std"] }
rand_core = "0.10.1"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
chrono = { version = "0.4.45", features = ["serde"] }
once_cell = "1.21.4"
