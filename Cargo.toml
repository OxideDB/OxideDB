[workspace]
resolver = "2"
members = [
    "oxide-core",
    "oxide-db", 
    "oxide-api",
    "oxide-logging",
    "oxide-vfs",
    "oxide-plugin-runtime",
    "oxide-plugin-sdk",
    "oxide-typegen",
    "oxidedb",
    "hello-plugin"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["bangprovn"]
license = "MIT"
description = "OxideDB - A hook-first database with plugin architecture"
repository = "https://github.com/bangprovn/oxidebase"
readme = "README.md"
keywords = ["database", "plugin", "wasm", "hooks", "admin-ui"]
categories = ["database", "web-programming"]

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
argon2 = { version = "0.5", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
jsonwebtoken = "9.0"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.0"
